    <label for="menu-toggle" class="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </label>

    <label for="menu-toggle"

    </label>

    <nav class="side-menu" aria-label="Main navigation">

        <label for="menu-toggle"

    <header class="dreams-header">

        <a href="index.html" class="logo">

    <!-- MAIN CONTENT -->

    <main class="dreams-page">

        <!-- OWL ILLUSTRATION -->

        <div class="dreams-owl">

        <section class="dreams-carousel"

            <div class="carousel-layout">

                <button class="carousel-arrow previous"
                        type="button"
                        aria-label="Previous video">
                    &#8592;

               <!-- YOUTUBE VIDEO -->


<div class="video-container">

    <iframe
        id="dreams-video"

        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
    </iframe>

</div>



                <!-- NEXT VIDEO -->
                <button class="carousel-arrow next"
                        type="button"
                        aria-label="Next video">
                    &#8594;
                </button>

            </div>


            <!-- VIDEO CAPTION -->

            <div class="video-caption" aria-live="polite">

                <p id="video-title">
                    Love Takes Miles (Official Video)
                </p>

                <p id="video-date">
                    December 11, 2025
                </p>

            </div>

        </section>
